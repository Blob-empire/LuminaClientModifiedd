name: Build APK

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (${{ github.event.inputs.buildType || 'debug' }})
        run: |
          BUILD_TYPE="${{ github.event.inputs.buildType || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --info
          else
            ./gradlew assembleDebug --stacktrace --info
          fi
        env:
          GRADLE_OPTS: '-Xmx4096m'

      - name: Upload APK (Debug)
        if: github.event.inputs.buildType != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload APK (Release)
        if: github.event.inputs.buildType == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7

      - name: Comment PR with Build Status
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildType = '${{ github.event.inputs.buildType || 'debug' }}';
            const status = '${{ job.status }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const comment = `## Build Status: ${status.toUpperCase()} ✅\n\n- **Build Type**: ${buildType}\n- **Build #${github.run_number}**\n- [View Details](${runUrl})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
